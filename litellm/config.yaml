# LiteLLM proxy config.
#
# Aliases that Claude Code will see (`model_name`) MUST start with "claude" or
# "anthropic" - that's the filter Claude Code applies when populating the
# /model picker from the gateway's /v1/models response.

model_list:
  # Names MUST start with "claude" or "anthropic" for Claude Code's
  # /v1/models discovery to add them to the /model picker.
  #
  # GitHub Copilot brokers real Claude models on higher tiers, so we route
  # through them directly - no Messages<->OpenAI Chat translation needed.

  # ---- 1:1 pass-throughs for Copilot's Claude IDs ------------------------
  # Use these directly: `claudio --model claude-opus-4.7`
  - model_name: claude-opus-4.7
    litellm_params:
      model: github_copilot/claude-opus-4.7
  - model_name: claude-opus-4.6
    litellm_params:
      model: github_copilot/claude-opus-4.6
  - model_name: claude-opus-4.5
    litellm_params:
      model: github_copilot/claude-opus-4.5
  - model_name: claude-sonnet-4.6
    litellm_params:
      model: github_copilot/claude-sonnet-4.6
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: github_copilot/claude-sonnet-4.5
  - model_name: claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5

  # ---- Dash-form aliases ------------------------------------------------
  # Claude Code's ANTHROPIC_DEFAULT_*_MODEL env vars (set by claudio.ps1)
  # use dashes, not dots. These let `/model opus|sonnet|haiku` resolve
  # cleanly to the right Copilot Claude.
  - model_name: claude-opus-4-7
    litellm_params:
      model: github_copilot/claude-opus-4.7
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: github_copilot/claude-sonnet-4.6
  - model_name: claude-haiku-4-5
    litellm_params:
      model: github_copilot/claude-haiku-4.5

  # ---- Non-Claude fallbacks --------------------------------------------
  # Aliases must start with "claude" or "anthropic" for Claude Code's
  # /v1/models discovery to surface them. The "claude-via-" prefix makes
  # the actual upstream provider readable in the picker. These are
  # opt-in fallbacks — defaults stay on real Claude. Translation between
  # Anthropic Messages and OpenAI Chat is handled by LiteLLM thanks to
  # `drop_params: true` below.
  - model_name: claude-via-gpt-5.4
    litellm_params:
      model: github_copilot/gpt-5.4
  - model_name: claude-via-gpt-5.3-codex
    litellm_params:
      model: github_copilot/gpt-5.3-codex
  - model_name: claude-via-gpt-5-mini
    litellm_params:
      model: github_copilot/gpt-5-mini
  - model_name: claude-via-gemini-3.1-pro
    litellm_params:
      model: github_copilot/gemini-3.1-pro-preview

# Master key gates the admin API and is what the wrapper sends as
# ANTHROPIC_AUTH_TOKEN. Pulled from the env at startup.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  # No `database_url` here. LiteLLM's persistent spend tracking requires
  # Prisma, which isn't in the [proxy] extra and brings in a Node-side
  # `prisma generate` step. For v1 we keep the image lean. /spend in the
  # webapp will show only what LiteLLM has accumulated since startup.

litellm_settings:
  # Drop OpenAI-only params Anthropic clients send that Copilot rejects.
  drop_params: true
  set_verbose: false
  # Custom callback that appends each request as JSONL to /data/litellm/spend.jsonl
  # so /spend in the webapp has historic data without needing Prisma.
  # Resolved as `import spend_logger; spend_logger.proxy_handler_instance`,
  # which requires PYTHONPATH=/etc/litellm (set in the Dockerfile).
  callbacks: spend_logger.proxy_handler_instance
